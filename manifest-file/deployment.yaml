apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: default
  labels:
    tier: frontend
spec:
  replicas: 3
  selector:
    #matchLabels:
      #tier: frontend
    matchExpressions:
      - {
          key: app,
          operator: In,
          values: ["webserver", "webserver2"]
        }
  template:
    metadata:
      labels:
        app: webserver
        tier: frontend
        environment: dev
    spec:
      containers:
        - name: nginx-container-deployment
          image: nginx:latest
          resources:
            requests:
              memory: 30Mi
              cpu: 1m
            limits:
              memory: 40Mi
              cpu: 1m
          ports:
            - containerPort: 80