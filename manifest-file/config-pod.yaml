apiVersion: v1
kind: Pod
metadata:
  name: nginx-db-pod
spec:
  containers:
  - name: nginx
    image: nginx:latest
    env:
    - name: db_h
      valueFrom:
        configMapKeyRef:
          name: db-connection
          key: db_h.txt
    - name: db_p
      valueFrom:
        configMapKeyRef:
          name: db-connection
          key: db_p.txt